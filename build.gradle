plugins {
    id 'java'
    id 'io.qameta.allure' version '2.8.1'
}

allure{
    version = '2.17.3'
    autoconfigure = true
    configuration = 'testImplementation'
    aspectjVersion = '1.9.8'
}

sourceCompatibility = 17
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
//    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
//    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation 'org.testng:testng:7.7.0'

    implementation 'org.seleniumhq.selenium:selenium-java:4.7.1'
    implementation 'com.codeborne:selenide:7.7.1'

    implementation group: 'io.qameta.allure', name: 'allure-testng', version: '2.17.3'
    implementation group: 'io.qameta.allure', name: 'allure-selenide', version: '2.17.3'
    implementation group: 'org.aspectj', name: 'aspectjweaver', version: '1.9.8'
    implementation group: 'com.github.javafaker', name: 'javafaker', version: '1.0.2'
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.3.1'

}

test {
    useTestNG()
}

